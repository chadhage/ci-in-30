name: Deploy microsite to GitHub Pages

on:
  push:
    branches:
      - microsite-only
    paths:
      - ".docs/microsite/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate microsite
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload microsite
        uses: actions/upload-pages-artifact@v3
        with:
          path: .docs/microsite

      - name: Deploy microsite
        id: deployment
        uses: actions/deploy-pages@v4
